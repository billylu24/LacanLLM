[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lacanllm"
version = "0.5.0"
description = "LacanLLM Pipeline v3"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.12,<1.15",
  "bitsandbytes>=0.50,<0.51",
  "huggingface-hub>=1.5,<2",
  "torch>=2.8,<2.9",
  "transformers>=5.8,<5.9",
]

[project.scripts]
lacanllm-pipeline-v3 = "lacanllm.pipeline_v3.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
