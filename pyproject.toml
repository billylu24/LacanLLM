[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lacanllm"
version = "0.2.0"
description = "A reproducible SFT/QLoRA pipeline for a Lacanian question-answering model"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Billy Lu" }]
dependencies = [
  "accelerate>=1.13,<1.14",
  "bitsandbytes>=0.49,<0.50",
  "datasets>=4.8,<4.9",
  "huggingface-hub>=1.13,<1.14",
  "matplotlib>=3.11,<3.12",
  "numpy>=2.4,<2.5",
  "peft>=0.19,<0.20",
  "sentencepiece>=0.2,<0.3",
  "torch>=2.11,<2.12",
  "tqdm>=4.67,<5",
  "transformers>=5.7,<5.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

