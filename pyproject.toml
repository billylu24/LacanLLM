[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lacanllm"
version = "0.5.0"
description = "LacanLLM Pipeline v3"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.14,<2",
  "bitsandbytes>=0.50,<1",
  "huggingface-hub>=0.34,<1",
  "transformers>=5.15,<6",
]

[project.scripts]
lacanllm-pipeline-v3 = "lacanllm.pipeline_v3.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
