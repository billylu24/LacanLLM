[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lacanllm"
version = "0.3.0"
description = "Auditable data and training pipelines for LacanLLM"
readme = "README.md"
requires-python = ">=3.11,<3.13"

[project.optional-dependencies]
models = [
  "accelerate>=1.10,<2",
  "bitsandbytes>=0.47,<1",
  "pillow>=10,<13",
  "protobuf>=5,<7",
  "sentencepiece>=0.2,<1",
  "torch>=2.9,<3",
  "torchvision>=0.24,<1",
  "transformers>=5,<6",
]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
training = [
  "datasets>=3.4,<4.4",
  "optuna>=4.5,<5",
  "peft>=0.18,<1",
  "trl>=0.18,<1",
]

[project.scripts]
lacanllm-data = "lacanllm.data.build:main"
lacanllm-pipeline-v2 = "lacanllm.data.pipeline_v2:main"
lacanllm-final-release = "lacanllm.data.release:main"
lacanllm-experiments = "lacanllm.training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
